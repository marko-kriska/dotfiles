# --- FOOT TERMINAL CONFIGURATION ---

# Main terminal application settings
shell=/bin/bash
term=foot
login-shell=no

# Initial window properties (LARGER INITIAL WINDOW SIZE)
initial-window-size-chars=110x32
initial-window-mode=windowed
pad=12x12                               # Inner padding for text margins

[main]
# Typography using FiraCode Nerd Font Retina (Size 10)
font=FiraCode Nerd Font:size=10:style=Retina
font-bold=FiraCode Nerd Font:size=10:style=Bold
font-italic=FiraCode Nerd Font:size=10:style=Italic

# Scrollback history capacity
[scrollback]
lines=5000                              # Lines kept in scrollback history
multiplier=3.0

# Cursor styling and behavior
[cursor]
style=block
blink=yes
beam-thickness=1.5

# Mouse interaction parameters
[mouse]
hide-when-typing=yes

# --- DRACULA THEME (MODERN COLORS-DARK FORMAT) ---
[colors-dark]
alpha=1.0                               # Fully opaque for maximum text clarity
foreground=f8f8f2                       # Dracula Light Grey
background=282a36                       # Dracula Dark Purple

## Normal ANSI Colors
regular0=21222c  # black (darker background)
regular1=ff5555  # red
regular2=50fa7b  # green
regular3=f1fa8c  # yellow
regular4=bd93f9  # blue / purple
regular5=ff79c6  # magenta / pink
regular6=8be9fd  # cyan
regular7=f8f8f2  # white

## Bright ANSI Variants
bright0=6272a4   # bright black (comment color)
bright1=ff6e6e   # bright red
bright2=69ff94   # bright green
bright3=ffffa5   # bright yellow
bright4=d6acff   # bright blue / purple
bright5=ff92df   # bright magenta / pink
bright6=a4ffff   # bright cyan
bright7=ffffff   # bright white

# --- KEY BINDINGS ---
[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+r            # Open scrollback history search
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n          # Open a new instance of Foot

[search-bindings]
cancel=Escape
commit=Return
find-prev=Control+r
find-next=Control+s
